name: Release

# Tag v* -> verifies the tag against pubspec/CHANGELOG, builds every platform and
# attaches the signed web, Linux, Android and Windows artefacts to a GitHub
# release. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version, tag and changelog
        run: python3 tools/release.py check --tag "$GITHUB_REF_NAME"

  web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.8, cache: true}
      - run: flutter pub get
      - run: flutter build web --release
      - name: Zip site
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -f build/web/sqlite3.wasm build/web/sqflite_sw.js
          cd build/web && zip -qr "$GITHUB_WORKSPACE/Montala-${VERSION}-web.zip" .
      - uses: actions/upload-artifact@v4
        with: {name: web, path: "Montala-*-web.zip"}

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.8, cache: true}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build libgtk-3-dev pkg-config
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - name: Package tar.gz and AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp packaging/linux/montala.desktop build/linux/x64/release/bundle/
          tar czf "Montala-${VERSION}-linux-x64.tar.gz" -C build/linux/x64/release bundle
          # AppImage is best-effort: if appimagetool download fails, the tar.gz still ships.
          chmod +x packaging/linux/build_appimage.sh tools/build_all.sh || true
          VERSION="$VERSION" ./packaging/linux/build_appimage.sh \
            || echo "::warning::AppImage build skipped"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Montala-*-linux-x64.tar.gz
            dist/Montala-*-x86_64.AppImage
          if-no-files-found: warn

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.8, cache: true}

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"
          KEYSTORE="$RUNNER_TEMP/montala-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/key.properties

      - run: flutter pub get
      - run: flutter build appbundle --release
      - run: flutter build apk --release --split-per-abi

      - name: Verify signatures
        env:
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$APKSIGNER" verify --print-certs "$APK"
          cert=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          echo "AAB SHA-256: $cert"
          # apksigner prefixes this line with "Signer #1" on some build-tools
          # versions and "V2 Signer"/"V3 Signer" on others; match any prefix.
          actual=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          aab_actual=$(printf '%s' "$cert" | tr -d ':' | tr 'A-F' 'a-f')
          expected=$(printf '%s' "${ANDROID_CERT_SHA256:-}" | tr -d ':' | tr 'A-F' 'a-f')
          if [ -n "$expected" ]; then
            if [ -z "$actual" ] || [ -z "$aab_actual" ]; then
              echo "::error::Could not read the APK/AAB certificate digest"
              exit 1
            fi
            if [ "$actual" != "$expected" ] || [ "$aab_actual" != "$expected" ]; then
              echo "::error::APK/AAB certificate does not match ANDROID_CERT_SHA256"
              exit 1
            fi
          fi

      - name: Name artefacts with the release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/android
          cp build/app/outputs/bundle/release/app-release.aab "dist/android/Montala-${VERSION}.aab"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
               "dist/android/Montala-${VERSION}-${abi}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/android/Montala-*
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: 3.47.8, cache: true}
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh
      - name: Build installer
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          iscc "/DAppVersion=$version" packaging\windows\montala.iss
        shell: pwsh
      - name: Sanity-check bundled SQLite
        run: |
          if (-not (Test-Path "build\windows\x64\runner\Release\sqlite3.dll")) {
            Add-Content $env:GITHUB_STEP_SUMMARY "WARNING: sqlite3.dll missing from the Windows bundle"
            Write-Host "::warning::sqlite3.dll missing from the Windows bundle"
          } else { Write-Host "sqlite3.dll bundled OK" }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Montala-*-windows-x64-setup.exe
          if-no-files-found: warn

  publish:
    needs: [verify, web, linux, android, windows]
    runs-on: ubuntu-latest
    steps:
      # Needed for tools/release.py, which extracts the release notes.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: artifacts}
      - name: Assemble release assets and notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir upload
          find artifacts -type f -exec cp {} upload/ \;
          ( cd upload && sha256sum * > SHA256SUMS )
          python3 tools/release.py notes "$VERSION" > RELEASE_NOTES.md
          ls -lh upload
          cat RELEASE_NOTES.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" upload/* -R "$GITHUB_REPOSITORY" \
            --notes-file RELEASE_NOTES.md \
            --title "مُنتَلا $GITHUB_REF_NAME"
