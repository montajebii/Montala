<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="مُنتَلا — محاسبه سود و زیان فرضی دارایی‌ها بر پایه تاریخ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0F766E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>مُنتَلا</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #FCFAF7;
      font-family: "Vazirmatn", Tahoma, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #FCFAF7;
      transition: opacity 260ms ease;
      z-index: 99;
    }
    #loading .mark {
      width: 62px; height: 62px;
      border-radius: 18px;
      background: #0F766E;
      color: #fff;
      display: grid; place-items: center;
      font-size: 26px; font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 22px rgba(15,118,110,0.26);
    }
    #loading .name { font-size: 20px; font-weight: 700; color: #1E2321; }
    #loading .sub { font-size: 12px; color: #6B7370; }
    .spinner {
      width: 22px; height: 22px;
      border: 2.5px solid #E5DFD6;
      border-top-color: #0F766E;
      border-radius: 50%;
      animation: spin 720ms linear infinite;
      margin-top: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="mark">م</div>
    <div class="name">مُنتَلا</div>
    <div class="sub">در حال آماده‌سازی داده‌ها…</div>
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 280);
    });
  </script>
</body>
</html>
